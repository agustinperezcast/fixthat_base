{% extends 'base.html' %}
{% block title %}{{ 'Editar' if contact else 'Nuevo' }} registro · Gestor{% endblock %}
{% block content %}
  <section class="form-card">
    <h1>{{ 'Editar registro' if contact else 'Nuevo registro' }}</h1>
    <p class="muted">El nombre es obligatorio; el correo y las notas son opcionales.</p>
    <form method="post" class="contact-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="name">Nombre <span aria-hidden="true">*</span></label>
      <input id="name" name="name" type="text" maxlength="120" required autofocus value="{{ values.get('name', '') }}">

      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" maxlength="254" value="{{ values.get('email', '') }}">

      <label for="notes">Notas</label>
      <textarea id="notes" name="notes" rows="5" maxlength="2000">{{ values.get('notes', '') }}</textarea>

      <div class="form-actions">
        <button class="button button-primary" type="submit">Guardar</button>
        <a class="button" href="{{ url_for('index') }}">Cancelar</a>
      </div>
    </form>
  </section>
{% endblock %}
